<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<title>사다리게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: 모임 테이블 위 종이 사다리. 화면은 따뜻한 종이색으로 조용하게, 색은 사다리 판의 사인펜 선과 결과 공개에만 쓴다 */
  :root {
    color-scheme: light;
    --paper: #f7f4ee;
    --card: #fdfbf7;
    --raised: #efe9df;
    --line: rgba(31, 27, 22, .10);
    --ink: #1f1b16;
    --ink-2: #5e554a;
    --muted: #776e62;
    --accent: #c8372a;
    --on-accent: #ffffff;
    --tape: #eadfc4;
    --grid: rgba(64, 104, 150, .10);
    --hand: "Gaegu", "IBM Plex Sans KR", sans-serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --ease: cubic-bezier(.22, 1, .36, 1);
    --step--1: clamp(13px, .3vw + 12px, 14px);
    --step-0: clamp(15px, .4vw + 14px, 16px);
    --step-1: clamp(18px, 1vw + 15px, 22px);
    --step-2: clamp(28px, 3vw + 20px, 40px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--paper); color: var(--ink); font: 400 var(--step-0)/1.6 var(--body); word-break: keep-all; overflow-wrap: anywhere; overflow-x: hidden; }
  h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.25; text-wrap: balance; }
  p { margin: 0; text-wrap: pretty; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  #app { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 48px; transition: filter .3s; }
  .top { display: flex; align-items: center; gap: 8px; height: 64px; }
  .top h1 { flex: 1; font: 700 var(--step-2)/1 var(--hand); letter-spacing: .5px; }
  .icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); text-decoration: none; transition: background-color .15s var(--ease); }
  .icon-btn:hover { background: var(--raised); }
  .icon-btn .i { width: 20px; height: 20px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-weight: 500; transition: background-color .15s var(--ease), transform .15s var(--ease); }
  .btn:hover { background: var(--raised); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--ink); border-color: transparent; color: var(--paper); }
  .btn.primary:hover { background: #3a332b; }
  .btn.big { min-height: 52px; padding: 0 28px; font-size: var(--step-1); border-radius: 12px; }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .hint { color: var(--muted); font-size: var(--step--1); }

  /* 설정 화면 */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .count { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .count h2 { font-size: var(--step-1); }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
  .stepper button:hover { background: var(--raised); }
  .stepper b { min-width: 48px; text-align: center; font: 700 32px/1 var(--hand); font-variant-numeric: tabular-nums; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; }
  @media (max-width: 680px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 24px; } .panel { padding: 20px 16px; } }
  .col h2 { font-size: var(--step-0); margin-bottom: 12px; }
  .col h2 small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: var(--step--1); }
  .entries { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .entry { display: flex; align-items: center; gap: 8px; }
  .entry input { flex: 1; width: 100%; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--paper); outline: none; transition: border-color .15s var(--ease); }
  .entry input:focus { border-color: var(--ink-2); background: var(--card); }
  .token-btn { width: 44px; height: 44px; flex: none; padding: 0; border: 0; border-radius: 50%; background: none; }
  .token-btn img, .token img { width: 100%; height: 100%; display: block; }
  .kind { flex: none; min-width: 64px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-weight: 500; font-size: var(--step--1); }
  .kind.win { color: var(--accent); border-color: rgba(200, 55, 42, .4); background: rgba(200, 55, 42, .06); }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); font-size: var(--step--1); }
  .chip:hover { background: var(--raised); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .toggle { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; color: var(--ink-2); }
  .toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .toggle span.sw { position: relative; width: 40px; height: 24px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); flex: none; transition: background-color .15s var(--ease); }
  .toggle span.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.15); transition: transform .15s var(--ease); }
  .toggle input:checked + span.sw { background: var(--ink); }
  .toggle input:checked + span.sw::after { transform: translateX(16px); }
  .toggle input:focus-visible + span.sw { outline: 2px solid var(--accent); outline-offset: 2px; }
  .start { display: flex; justify-content: flex-end; margin-top: 24px; }
  @media (max-width: 680px) { .start .btn { width: 100%; } }

  /* 게임 화면: 모눈종이 위 사인펜 사다리 */
  #game .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; min-height: 44px; }
  #game .bar p { color: var(--ink-2); }
  .board { background-color: #fffdf8; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px; border: 1px solid var(--line); border-radius: 16px; padding: 16px 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .stage { margin: 0 auto; }
  .lane { display: flex; }
  .lane > * { flex: 1 1 0; min-width: 0; }
  .player { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 2px 8px; border: 0; background: none; transition: opacity .2s var(--ease), transform .15s var(--ease); }
  .player .token { width: 48px; height: 48px; }
  .player:hover:not(:disabled) { transform: translateY(-2px); }
  .player .nm { font: 700 20px/1.1 var(--hand); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player.running { opacity: .25; }
  .player.done { opacity: .55; }
  .player:disabled { cursor: default; }
  #board { display: block; width: 100%; }

  .result { position: relative; height: 72px; margin: 0 4px; border-radius: 8px; overflow: hidden; }
  .result .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; text-align: center;
    font: 700 19px/1.1 var(--hand); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .result .val small { font: 400 12px/1.2 var(--body); color: var(--muted); }
  .result.win .val { color: var(--accent); border-color: rgba(200,55,42,.35); }
  .result.lose .val { color: var(--muted); }
  /* 결과를 가린 종이 테이프 (고유 표시) */
  .tape { position: absolute; inset: 6px -4px; background: var(--tape); opacity: .96; transform: rotate(-2deg);
    clip-path: polygon(0 6%, 4% 0, 9% 7%, 15% 1%, 22% 6%, 30% 0, 38% 5%, 46% 1%, 55% 6%, 63% 0, 71% 6%, 79% 1%, 87% 6%, 94% 0, 100% 5%, 100% 95%, 95% 100%, 88% 94%, 80% 100%, 72% 95%, 64% 100%, 56% 94%, 47% 100%, 39% 95%, 31% 100%, 23% 94%, 15% 100%, 8% 95%, 0 100%);
    display: grid; place-items: center; color: rgba(94, 85, 74, .55); font: 700 24px/1 var(--hand); transition: transform .5s var(--ease), opacity .5s var(--ease); }
  .result:nth-child(even) .tape { transform: rotate(1.5deg); }
  .result.open .tape { transform: translate(18px, -64px) rotate(-14deg); opacity: 0; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .controls .sp { flex: 1; }
  @media (max-width: 560px) { .controls .sp { display: none; } .controls .btn { flex: 1 1 calc(50% - 4px); } }

  /* 결과 팝업 · 결과표 */
  .scrim { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(31, 27, 22, .42); }
  .card { position: relative; width: min(360px, 100%); background: var(--card); border-radius: 20px; padding: 32px 24px 24px; text-align: center; display: grid; gap: 12px; justify-items: center;
    box-shadow: 0 16px 48px rgba(31, 27, 22, .2); animation: rise .35s var(--ease); }
  .card .token { width: 88px; height: 88px; }
  .card.win .token { animation: hop .6s var(--ease) 2; }
  .card.lose .token { filter: grayscale(.6); animation: droop .6s var(--ease) both; }
  .card .who { color: var(--ink-2); }
  .stamp { padding: 4px 16px; border: 3px solid currentColor; border-radius: 8px; font: 700 34px/1.1 var(--hand); transform: rotate(-6deg); animation: stamp .4s var(--ease) .1s both; }
  .card.win .stamp { color: var(--accent); }
  .card.lose .stamp { color: var(--muted); }
  .card .prize { font: 700 30px/1.15 var(--hand); }
  .summary { width: min(440px, 100%); text-align: left; justify-items: stretch; max-height: 86vh; overflow: auto; }
  .summary h3 { font-size: var(--step-1); }
  .sum { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px; }
  .sum:nth-child(odd) { background: var(--paper); }
  .sum .token { width: 32px; height: 32px; }
  .sum .n { flex: 1; min-width: 0; font: 700 20px/1.2 var(--hand); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sum .r { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .sum.win .r { color: var(--accent); }
  .sum.lose .r { color: var(--muted); }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 65; opacity: 0; }
  #flash.win { animation: flashWin .8s var(--ease); }
  #flash.lose { animation: flashLose 1s var(--ease); }
  body.shake #app { animation: shake .55s cubic-bezier(.36,.07,.19,.97); }
  body.gray #app { filter: grayscale(1); }

  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.98) } to { opacity: 1; transform: none } }
  @keyframes hop { 0%, 100% { transform: none } 40% { transform: translateY(-14px) } }
  @keyframes droop { to { transform: rotate(-10deg) translateY(4px) } }
  @keyframes stamp { from { opacity: 0; transform: scale(1.8) rotate(-6deg) } to { opacity: 1; transform: rotate(-6deg) } }
  @keyframes shake { 15%, 85% { transform: translateX(-3px) } 30%, 70% { transform: translateX(6px) } 50% { transform: translateX(-8px) } }
  @keyframes flashWin { 0% { opacity: .9; background: radial-gradient(circle, rgba(255,250,235,.95) 0%, rgba(255,250,235,0) 70%) } 100% { opacity: 0 } }
  @keyframes flashLose { 0% { opacity: .8; background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(31,27,22,.45) 100%) } 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></symbol>
  <symbol id="i-ff" viewBox="0 0 24 24"><path d="m13 19 9-7-9-7v14ZM2 19l9-7-9-7v14Z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
</defs></svg>

<div id="app">
  <header class="top">
    <a class="icon-btn" href="index.html" aria-label="홈으로"><svg class="i"><use href="#i-back"/></svg></a>
    <h1>사다리게임</h1>
    <button class="icon-btn" id="muteBtn" aria-label="소리 끄기"><svg class="i"><use href="#i-vol"/></svg></button>
  </header>

  <!-- 설정 -->
  <section id="setup" class="panel">
    <div class="count">
      <h2>몇 명이 하나요</h2>
      <div class="stepper">
        <button id="minus" aria-label="한 명 빼기"><svg class="i"><use href="#i-minus"/></svg></button>
        <b id="count" class="num">4</b>
        <button id="plus" aria-label="한 명 더하기"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
    </div>
    <div class="cols">
      <div class="col">
        <h2>참가자<small>얼굴을 누르면 동물이 바뀌어요</small></h2>
        <div class="entries" id="nameList"></div>
      </div>
      <div class="col">
        <h2>상품과 벌칙<small>왼쪽 칸으로 당첨·꽝을 정해요</small></h2>
        <div class="entries" id="prizeList"></div>
        <div class="presets">
          <button class="chip" id="presetOne">한 명만 당첨</button>
          <button class="chip" id="presetBomb">한 명만 꽝</button>
          <button class="chip" id="presetFill">빈칸은 꽝</button>
          <button class="chip" id="presetClear">모두 비우기</button>
        </div>
      </div>
    </div>
    <div class="opts">
      <label class="toggle"><input type="checkbox" id="optHide" checked><span class="sw"></span>가로줄 숨기기<span class="hint">지나간 길만 보여요</span></label>
      <label class="toggle"><input type="checkbox" id="optShuffle" checked><span class="sw"></span>결과 위치 섞기</label>
    </div>
    <div class="start"><button class="btn primary big" id="startBtn">사다리 만들기</button></div>
  </section>

  <!-- 게임 -->
  <section id="game" hidden>
    <div class="bar"><p id="hint">얼굴을 누르면 출발해요</p></div>
    <div class="board">
      <div class="scroller">
        <div class="stage" id="stage">
          <div class="lane" id="topRow"></div>
          <canvas id="board"></canvas>
          <div class="lane" id="bottomRow"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="allBtn"><svg class="i"><use href="#i-ff"/></svg>한 번에 결과 보기</button>
      <button class="btn" id="sumBtn" disabled><svg class="i"><use href="#i-list"/></svg>결과표</button>
      <span class="sp"></span>
      <button class="btn" id="reshuffleBtn"><svg class="i"><use href="#i-redo"/></svg>다시 만들기</button>
      <button class="btn" id="backBtn"><svg class="i"><use href="#i-edit"/></svg>참가자 고치기</button>
    </div>
  </section>
</div>

<div id="flash"></div>
<canvas id="fx"></canvas>
<div class="scrim" id="popModal" hidden><div class="card" id="pop" role="dialog" aria-live="assertive"></div></div>
<div class="scrim" id="sumModal" hidden><div class="card summary" id="summary" role="dialog" aria-label="결과표"></div></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const icon = (id) => `<svg class="i" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  document.querySelectorAll('svg.i').forEach((s) => s.setAttribute('aria-hidden', 'true'));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 */ } },
  };

  /* =====================================================
   *  동물 얼굴 토큰 (직접 그린 SVG)
   * ===================================================== */
  const ANIMALS = ['cat', 'rabbit', 'bear', 'dog', 'fox', 'pig', 'frog', 'chick', 'mouse', 'panda', 'tiger', 'koala'];
  const ANIMAL_KO = { cat: '고양이', rabbit: '토끼', bear: '곰', dog: '강아지', fox: '여우', pig: '돼지', frog: '개구리', chick: '병아리', mouse: '쥐', panda: '판다', tiger: '호랑이', koala: '코알라' };
  // 사인펜 세트 색
  const PENS = ['#d6402f', '#2f6fd6', '#2f9a5a', '#e07a1f', '#7a4fc9', '#1f9aa0', '#d64f86', '#8a5a2b', '#2d3f7a', '#6f8a1f', '#b23aa8', '#4a4540'];
  function faceSVG(a, c) {
    const ink = '#1f1b16', lt = 'rgba(255,255,255,.55)', dk = 'rgba(0,0,0,.22)';
    let back = '', front = '', head = c, eyes = true, mouth = true;
    switch (a) {
      case 'cat': back = `<path d="M9 22 12 5l10 9ZM39 22 36 5l-10 9Z" fill="${c}"/><path d="M12.5 16 14 9l4.5 4.5ZM35.5 16 34 9l-4.5 4.5Z" fill="${lt}"/>`; front = `<path d="M8 29h7M8 32l7-1M40 29h-7M40 32l-7-1" stroke="${ink}" stroke-width="1" opacity=".4"/>`; break;

    for (let k = 1; k < pts.length; k++) {
      const p1 = px(pts[k]), seg = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      if (left >= seg) { c.lineTo(p1.x, p1.y); left -= seg; head = p1; p0 = p1; }
      else { const t = seg ? left / seg : 0; head = { x: p0.x + (p1.x - p0.x) * t, y: p0.y + (p1.y - p0.y) * t }; c.lineTo(head.x, head.y); break; }
    }
    c.stroke(); return head;
  }
  const pathLen = (pts) => { let L = 0; for (let k = 1; k < pts.length; k++) { const a = px(pts[k - 1]), b = px(pts[k]); L += Math.hypot(b.x - a.x, b.y - a.y); } return L; };

  function draw(now = performance.now()) {
    const c = bctx, n = G.players.length, hide = $('optHide').checked; c.clearRect(0, 0, BW, BH);
    for (let i = 0; i < n; i++) pen(px({ x: i, y: 0 }), px({ x: i, y: 1 }), 'rgba(31,27,22,.82)', 3, (i % 2 ? 1 : -1) * 1.2);
    for (let r = 0; r < ROWS; r++) for (let g = 0; g < n - 1; g++) {
      const rg = G.rungs[r][g]; if (!rg || (hide && !G.revealed.has(`${r}-${g}`))) continue;
      const y = (r + 1 + rg.j) / (ROWS + 1); pen(px({ x: g, y }), px({ x: g + 1, y }), 'rgba(31,27,22,.82)', 3, rg.w);
    }
    c.globalAlpha = .85; for (const t of G.trails) trail(t.pts, G.players[t.i].color, 6); c.globalAlpha = 1;
    if (G.active) {
      const a = G.active, pl = G.players[a.i], head = trail(a.pts, pl.color, 7, a.dist), img = faceImage(pl.animal, pl.color), s = 40;
      const bob = Math.sin(now / 70) * 2.5;
      c.fillStyle = 'rgba(31,27,22,.12)'; c.beginPath(); c.ellipse(head.x, head.y + s / 2 - 2, s / 3, 4, 0, 0, 7); c.fill();
      if (img.complete) c.drawImage(img, head.x - s / 2, head.y - s / 2 - 4 + bob, s, s);
    }
    for (let i = 0; i < n; i++) for (const y of [0, 1]) { const p = px({ x: i, y }); c.fillStyle = '#1f1b16'; c.beginPath(); c.arc(p.x, p.y, 4, 0, 7); c.fill(); }
  }

  function renderRows() {
    const top = $('topRow'), bot = $('bottomRow'); top.innerHTML = ''; bot.innerHTML = '';
    G.players.forEach((p, i) => {
      const b = document.createElement('button'); b.className = 'player'; b.setAttribute('aria-label', `${p.name} 출발`);
      b.innerHTML = `${tokenHTML(p.animal, p.color, p.name)}<span class="nm">${esc(p.name)}</span>`;
      b.onclick = () => startOne(i); top.appendChild(b);
    });
    G.results.forEach(() => { const d = document.createElement('div'); d.className = 'result'; d.innerHTML = '<div class="val"></div><div class="tape" aria-hidden="true">?</div>'; bot.appendChild(d); });
    updateButtons();
  }
  function updateButtons() {
    const total = G.players.length, cnt = Object.keys(G.done).length;
    [...$('topRow').children].forEach((b, i) => { b.disabled = G.busy || i in G.done; b.classList.toggle('done', i in G.done); b.classList.toggle('running', G.active?.i === i); });
    $('allBtn').disabled = G.busy || cnt === total; $('reshuffleBtn').disabled = G.busy; $('backBtn').disabled = G.busy; $('sumBtn').disabled = cnt === 0;
    $('hint').textContent = cnt === total ? '모두 끝났어요. 결과표에서 한눈에 볼 수 있어요' : G.busy ? '어디로 갈까요' : `얼굴을 누르면 출발해요 · ${total - cnt}명 남음`;
  }

  function run(i, speedMul = 1) {
    return new Promise((resolve) => {
      const { pts, end } = pathFor(i); G.active = { i, pts, dist: 0 }; updateButtons();
      let last = performance.now(), acc = 0, steps = 0, seenK = 0; const speed = Math.max(300, BH * .95) * speedMul;
      const tick = (now) => {
        const dt = Math.min(.05, (now - last) / 1000); last = now; const L = pathLen(pts);
        G.active.dist += speed * dt; acc += speed * dt; if (acc > 30) { acc = 0; Sound.step(steps++); }
        let s = 0;
        for (let k = 1; k < pts.length; k++) {
          const a = px(pts[k - 1]), b = px(pts[k]); if (s > G.active.dist) break;
          if (pts[k].rung) { G.revealed.add(pts[k].rung); if (k > seenK) { seenK = k; Sound.turn(); } }
          s += Math.hypot(b.x - a.x, b.y - a.y);
        }
        draw(now);
        if (G.active.dist >= L) { G.trails.push({ i, pts }); G.active = null; draw(now); resolve(end); } else requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  async function startOne(i) {
    if (G.busy || i in G.done) return;
    Sound.init(); Sound.go(); G.busy = true;
    const end = await run(i, 1);
    Sound.drumroll(.7); await wait(720);
    reveal(i, end, true); G.busy = false; updateButtons();
  }
  async function runAll() {
    if (G.busy) return; Sound.init(); Sound.go(); G.busy = true; updateButtons();
    for (let i = 0; i < G.players.length; i++) { if (i in G.done) continue; const end = await run(i, 2.6); reveal(i, end, false); updateButtons(); await wait(300); }
    G.busy = false; updateButtons(); await wait(400); showSummary();
  }
  function reveal(i, end, big) {
    G.done[i] = end; const res = G.results[end], p = G.players[i], cell = $('bottomRow').children[end];
    cell.querySelector('.val').innerHTML = `<span>${esc(res.label)}</span><small>${esc(p.name)}</small>`;
    cell.classList.add('open', res.lose ? 'lose' : 'win'); Sound.peel();
    const r = cell.getBoundingClientRect();
    if (big) {
      showPop(p, res);
      if (res.lose) { Sound.lose(); FX.flash('lose'); FX.shake(true); setTimeout(() => FX.gloom(), 150); }
      else { Sound.win(); FX.flash('win'); FX.bigWin(); }
    } else if (res.lose) { Sound.miniLose(); FX.shake(false); }
    else { Sound.miniWin(); FX.confetti(r.left + r.width / 2, r.top, 50, Math.PI / 1.5, -Math.PI / 2, 700); }
    updateButtons();
  }
  function showPop(p, res) {
    const pop = $('pop'); pop.className = 'card ' + (res.lose ? 'lose' : 'win');
    pop.innerHTML = `${tokenHTML(p.animal, p.color, p.name)}<p class="who">${esc(p.name)}</p><div class="stamp">${res.lose ? '꽝' : '당첨'}</div>
      ${/^(꽝|당첨)$/.test(res.label) ? '' : `<p class="prize">${esc(res.label)}</p>`}<button class="btn primary" id="popOk" style="margin-top:8px;min-width:140px">확인</button>`;
    $('popModal').hidden = false; $('popOk').focus(); $('popOk').onclick = closePop;
  }
  function closePop() { Sound.click(); $('popModal').hidden = true; if (Object.keys(G.done).length === G.players.length) setTimeout(showSummary, 300); }
  $('popModal').addEventListener('click', (e) => { if (e.target.id === 'popModal') closePop(); });

  function showSummary() {
    const rows = G.players.map((p, i) => ({ p, res: i in G.done ? G.results[G.done[i]] : null }));
    rows.sort((a, b) => (a.res && !a.res.lose ? 0 : 1) - (b.res && !b.res.lose ? 0 : 1));
    $('summary').innerHTML = `<h3>결과표</h3><div>${rows.map((r) => `<div class="sum ${r.res ? (r.res.lose ? 'lose' : 'win') : ''}">${tokenHTML(r.p.animal, r.p.color, r.p.name)}<span class="n">${esc(r.p.name)}</span>
      <span class="r">${r.res ? icon(r.res.lose ? 'x' : 'gift') + esc(r.res.label) : '아직'}</span></div>`).join('')}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn" id="sumClose">닫기</button><button class="btn primary" id="sumAgain">같은 사람들로 다시</button></div>`;
    $('sumModal').hidden = false; Sound.miniWin();
    $('sumClose').onclick = () => { Sound.click(); $('sumModal').hidden = true; };
    $('sumAgain').onclick = () => { $('sumModal').hidden = true; restart(); };
  }
  $('sumModal').addEventListener('click', (e) => { if (e.target.id === 'sumModal') $('sumModal').hidden = true; });
  function restart() { Sound.init(); Sound.boop(true); buildGame(); renderRows(); layout(); }

  $('startBtn').onclick = () => { Sound.init(); Sound.go(); $('setup').hidden = true; $('game').hidden = false; buildGame(); renderRows(); layout(); scrollTo({ top: 0, behavior: 'smooth' }); };
  $('allBtn').onclick = runAll;
  $('sumBtn').onclick = () => { Sound.click(); showSummary(); };
  $('reshuffleBtn').onclick = restart;
  $('backBtn').onclick = () => { Sound.click(); $('game').hidden = true; $('setup').hidden = false; renderSetup(); };
  $('optHide').onchange = () => draw();
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('popModal').hidden) closePop(); $('sumModal').hidden = true; } });
  addEventListener('resize', () => { FX.resize(); if (!$('game').hidden) layout(); });
  renderSetup();
  window.__ladder = { G, S };
})();
</script>
</body>
</html>
